<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Google Homepage Clone</title>
    </head>
    <body>
        <!-- TOP SECTION -->
        <div class="top-section">
            <!-- Left Side Links -->
            <div class="left-links">
                <a href="https://about.google/">About</a>
                <a href="https://store.google.com/">Store</a>
            </div>

            <!-- Right Side Links & Icons -->
            <div class="right-links">
                <a href="https://mail.google.com">Gmail</a>
                <a href="https://images.google.com">Images</a>
                <!-- Icons represented as images -->
                <img
                    src="../../assets/fill/png/128/google-app-9dots.png"
                    alt="Google apps"
                />
                <img src="../../assets/cat.jpg" alt="Profile picture" />
            </div>
        </div>

        <!-- MIDDLE SECTION -->
        <div class="middle-section">
            <!-- Google Logo -->
            <div class="logo-container">
                <img
                    src="../../assets/faltu_pics/googlelogo.png"
                    alt="Google Logo"
                />
            </div>

            <!-- Search Form -->
            <div class="search-container">
                <form action="">
                    <!-- Optional label for accessibility -->
                    <label for="search-input">Search</label>

                    <!-- Search Input with icons inside/around it -->
                    <input type="text" id="search-input" />

                    <!-- Search Icons (magnifying glass, mic, camera) -->
                    <img
                        src="../../assets/fill/png/128/search.png"
                        alt="Search icon"
                    />
                    <img
                        src="../../assets/fill/png/128/mic.png"
                        alt="Voice search"
                    />
                    <img
                        src="../../assets/fill/png/128/droplet.png"
                        alt="Google Lens"
                    />

                    <!-- Buttons -->
                    <button type="submit">Google Search</button>
                    <button type="button">I'm Feeling Lucky</button>
                </form>
            </div>
        </div>

        <!-- BOTTOM SECTION -->
        <div class="bottom-section">
            <!-- Left Footer Links -->
            <div class="footer-left">
                <a href="#">Advertising</a>
                <a href="#">Business</a>
                <a href="#">How Search works</a>
            </div>

            <!-- Middle Footer Links -->
            <div class="footer-middle">
                <a href="#">Carbon neutral since 2007</a>
            </div>

            <!-- Right Footer Links -->
            <div class="footer-right">
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Settings</a>
            </div>
        </div>
    </body>
</html>
